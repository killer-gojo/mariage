<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Mariage - Redirection en cours...</title>
    <script>
        // Fonction pour récupérer le lien frais de GitHub sans aucun cache possible
        async function redirectToTunnel() {
            try {
                // On ajoute un timestamp unique et un nombre aléatoire pour forcer GitHub/Netlify à donner du neuf
                const antiCache = 't=' + Date.now() + '&r=' + Math.random();
                const response = await fetch('https://raw.githubusercontent.com/killer-gojo/mariage/main/url.txt?' + antiCache, {
                    cache: 'no-store'
                });
                
                if (response.ok) {
                    const tunnelUrl = await response.text();
                    const cleanUrl = tunnelUrl.trim();
                    
                    if (cleanUrl && cleanUrl.startsWith('http')) {
                        // Redirection immédiate vers le nouveau tunnel actif
                        window.location.replace(cleanUrl);
                        return;
                    }
                }
                
                // Si le lien n'est pas encore prêt
                document.getElementById('message').innerHTML = "⏳ En attente du lancement du serveur...<br><span style='font-size: 13px; color: #78716c;'>Le photobooth n'est pas encore allumé sur le PC. Réessaie dans une minute !</span>";
                
            } catch (error) {
                document.getElementById('message').innerHTML = "⚠️ Connexion impossible au serveur.<br><span style='font-size: 13px; color: #78716c;'>Vérifie ta connexion internet.</span>";
            }
        }

        // Lancement immédiat dès que la page s'ouvre
        window.onload = redirectToTunnel;
    </script>
</head>
<body style="text-align: center; font-family: sans-serif; margin-top: 20vh; background-color: #f5f5f4; color: #292524;">
    <h2 id="message">📸 Redirection vers l'espace photos du mariage...</h2>
    <p style="color: #78716c; font-size: 14px; margin-top: 10px;">Un tout petit instant, on prépare le tapis rouge.</p>
</body>
</html>
