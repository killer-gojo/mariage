<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Mariage - Redirection en cours...</title>
    <script>
        async function redirectToTunnel() {
            try {
                // On récupère le lien instantanément depuis npoint.io avec un anti-cache
                const response = await fetch('https://api.npoint.io/TON_ID_UNIQUE?' + Date.now(), {
                    cache: 'no-store'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const cleanUrl = data.url ? data.url.trim() : "";
                    
                    if (cleanUrl && cleanUrl.startsWith('http')) {
                        window.location.replace(cleanUrl);
                        return;
                    }
                }
                
                document.getElementById('message').innerHTML = "⏳ En attente du lancement du serveur...<br><span style='font-size: 13px; color: #78716c;'>Le photobooth n'est pas encore allumé sur le PC.</span>";
                
            } catch (error) {
                document.getElementById('message').innerHTML = "⚠️ Connexion impossible au serveur.";
            }
        }
        window.onload = redirectToTunnel;
    </script>
</head>
<body style="text-align: center; font-family: sans-serif; margin-top: 20vh; background-color: #f5f5f4; color: #292524;">
    <h2 id="message">📸 Redirection vers l'espace photos du mariage...</h2>
</body>
</html>
